[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jira-resilient"
version = "0.6.0"
description = "Resilient JIRA Server data extraction at scale — seek pagination, reindex-aware recovery, three-tier resilient issue fetch."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "uofm-matt" }]
keywords = ["jira", "jira-server", "pagination", "etl", "data-warehouse"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["requests>=2.31", "urllib3>=2"]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-timeout>=2.3",
    "responses>=0.25",
    "ruff>=0.6",
    "twine>=5",
]

[project.urls]
Homepage = "https://github.com/uofm-matt/jira-resilient"
Issues   = "https://github.com/uofm-matt/jira-resilient/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/jira_resilient"]

# Allowlist, not a denylist. Hatchling excludes gitignored files but NOT untracked ones, so
# any stray file in the repo root would otherwise ship to PyPI permanently. Tests are kept
# so downstream packagers can run them.
[tool.hatch.build.targets.sdist]
include = [
    "/src/jira_resilient",
    "/tests",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "SIM", "RET", "UP", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
pretty = true
# No types-requests: requests ships its own py.typed, and the stub widens
# HTTPError.response to `Response | Any`, which hides a real Optional access.
# `src` only — tests/ has no __init__.py, so mypy names its modules `test_client`/`conftest`
# and a `tests.*` override cannot match them. Annotating 1700 lines of pytest functions has
# near-zero defect yield.

[tool.pytest.ini_options]
testpaths = ["tests", "src/jira_resilient"]
addopts = "--doctest-modules"
# Without this, a missing pytest-timeout turns the `timeout` key below into an unknown-config
# warning, which filterwarnings promotes to an INTERNALERROR. This makes it a clear message.
required_plugins = ["pytest-timeout"]
filterwarnings = ["error"]
# A dropped loop-exit condition must FAIL the suite, not hang it — client.py pages with
# `while True`, and a mutation test confirmed the suite otherwise runs until killed. The
# slowest test today is under 0.005s, so 15s is a ~3000x margin. Override a genuinely slow
# test with @pytest.mark.timeout(n) rather than raising this.
timeout = 15

[tool.coverage.run]
branch = true
source = ["jira_resilient"]

[tool.coverage.report]
show_missing = true
# Replaces coverage.py's default exclude list, which honors `# pragma: no cover`. This repo
# has zero suppressions of any kind; keeping the list empty enforces that by construction.
exclude_lines = []
