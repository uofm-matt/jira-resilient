name: publish

on:
  push:
    # `*` matches any run of non-`/` characters, so this filter is NOT release-only: a tag
    # like `v1-locked-2026-06-21` still matches, because `1` satisfies `[0-9]`. What stops it
    # is the `verify-tag` job below, comparing the built version against the tag. Pushing a
    # non-release `v…` tag therefore burns a full gate run before failing. Don't `--tags`.
    tags: ["v[0-9]*"]

permissions:
  contents: read

jobs:
  # A tag push matches no branch filter, so before this line publish.yml was the entire
  # release gate: pytest + ruff check on 3.12, no 3.13/3.14, no format check, no artifact
  # inspection. Reusing test.yml means a release can never be gated more weakly than main.
  gate:
    uses: ./.github/workflows/test.yml

  verify-tag:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Tag matches the version that was actually built
        run: |
          BUILT="${{ needs.gate.outputs.version }}"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$BUILT" != "$TAG" ]; then
            echo "::error::built version $BUILT != tag $TAG"; exit 1
          fi

  publish:
    needs: [gate, verify-tag]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Configure PyPI trusted publishing for this project, environment "pypi":
    # https://docs.pypi.org/trusted-publishers/
    environment: pypi
    permissions:
      id-token: write
    steps:
      # The bytes that were built, inspected and smoke-tested are the bytes that ship.
      # Nothing is rebuilt here.
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Without this, a re-run after a post-upload failure dies on the duplicate and
          # the GitHub Release below never gets created.
          skip-existing: true

  release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # Print lines between the `## [X.Y.Z]` header and the next `## [` header (exclusive).
      # The header is matched as a LITERAL prefix via index(), not a regex — `## [X.Y.Z]` as
      # a regex treats `[`/`]`/`.` as metacharacters and never matches, which silently
      # stubbed every release's notes. Note this also means a CHANGELOG heading that is not
      # bracketed will not reset `flag`, so keep every section header in `## [...]` form.
      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="## [$VERSION]" '
            index($0, ver) == 1 {flag=1; next}
            /^## \[/ {flag=0}
            flag {print}
          ' CHANGELOG.md > /tmp/release_notes.md
          if [ ! -s /tmp/release_notes.md ]; then
            echo "Release $GITHUB_REF_NAME — see CHANGELOG.md for details." > /tmp/release_notes.md
          fi
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Tolerant of a re-run: create, or update the release that a prior attempt left.
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/release_notes.md --latest dist/* \
          || gh release edit "$GITHUB_REF_NAME" --notes-file /tmp/release_notes.md --latest
